name: Label by app

# Issue forms ask "Which app?" as a dropdown. This reads that answer and
# applies the matching `app: …` label, so a single tracker covering every
# Atlassian app stays filterable.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const CHOICES = {
              'AccessLens (Jira)': 'app: accesslens',
              'Digest (Jira)': 'app: digest',
              'Evergreen (Confluence)': 'app: evergreen',
              'Mail Templates (Jira)': 'app: mail-templates',
              'Recur (Jira)': 'app: recur',
              'Not sure': 'app: unknown',
              'A new app': 'app: new',
              // Deliberately unlabelled — not about a specific app.
              'General question about keelapps': null,
            };

            // Issue forms render as "### Which app?" followed by a blank line
            // and the answer. Take the first non-empty line after the heading.
            const body = context.payload.issue.body || '';
            const section = body.split(/###\s*Which app\?/)[1];
            const answer = section
              && section.split('\n').map(s => s.trim()).find(s => s.length > 0);

            if (!answer) {
              core.info('No "Which app?" answer found; nothing to do.');
              return;
            }

            if (!(answer in CHOICES)) {
              core.warning(`Unrecognised app answer: ${answer}`);
              return;
            }
            const wanted = CHOICES[answer];

            const issue = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
            };

            // On `edited` the answer may have changed, so drop stale app labels.
            const current = context.payload.issue.labels.map(l => l.name);
            for (const name of current) {
              if (name.startsWith('app: ') && name !== wanted) {
                await github.rest.issues.removeLabel({ ...issue, name });
                core.info(`Removed ${name}`);
              }
            }

            if (wanted && !current.includes(wanted)) {
              await github.rest.issues.addLabels({ ...issue, labels: [wanted] });
              core.info(`Added ${wanted}`);
            }
