name: Feature request
description: Suggest something a keelapps product should be able to do
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The most useful requests describe a problem rather than a solution.
        If we understand what you are actually trying to accomplish, we can
        often find a better answer than the one either of us started with.

  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - AccessLens (Jira)
        - Digest (Jira)
        - Evergreen (Confluence)
        - Mail Templates (Jira)
        - Recur (Jira)
        - Keelhaven (macOS)
        - A new app
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The task or obligation behind the request — the audit you have to
        produce, the schedule you have to keep, the report someone expects.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: How do you handle it today?
      description: >
        Spreadsheets, scripts, manual work, another app, or simply living with
        it. This tells us how much the gap actually costs.
    validations:
      required: false

  - type: textarea
    id: proposal
    attributes:
      label: What would you like the app to do?
      description: If you already have a specific shape in mind, describe it here.
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often would you use this?
      options:
        - Daily
        - Weekly
        - Monthly
        - A few times a year
    validations:
      required: false
